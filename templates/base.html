<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dalal Street AI{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: #f8f9fa;
            color: #212529;
        }
        .navbar {
            background-color: #fff;
            border-bottom: 1px solid #dee2e6;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #007bff;
            text-decoration: none;
        }
        .navbar .nav-links a {
            color: #495057;
            text-decoration: none;
            font-size: 1rem;
            margin-left: 1.5rem;
        }
        .navbar .nav-links a:hover {
            color: #007bff;
        }
        main {
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: auto;
        }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body>

    <nav class="navbar">
        <a href="{% url 'security-list' %}" class="logo">Dalal Street AI</a>
        <div class="nav-links">
            <a href="{% url 'security-list' %}">Stocks</a>
            <a href="{% url 'mutual-fund-list' %}">Mutual Funds</a>
        </div>
    </nav>

    <main>
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>

</body>
</html>
